name: inference
base: core24
summary: Manage inference snaps
description: |
  This application acts as an entrypoint to the world of Inference Snaps.
  It provides a CLI to discover, install and manage inference snaps.

grade: stable
confinement: strict
adopt-info: version

layout:
  /usr/share/misc/pci.ids:
    bind-file: $SNAP/usr/share/misc/pci.ids
    
plugs:
  provider:
    interface: content
    content: inference-provider
    target: $SNAP/share/providers

parts:
  version:
    plugin: dump
    build-packages:
      - git
    source: .
    override-pull: |
      craftctl set version="$(git -C $SNAPCRAFT_PROJECT_DIR describe --always --dirty)"

  pci-ids:
    plugin: dump
    source: https://pci-ids.ucw.cz/v2.2/pci.ids
    source-type: file
    organize:
      pci.ids: usr/share/misc/pci.ids

  # Used for NVIDIA vRAM and CUDA Capability detection.
  # Only the binary is included to avoid staging libraries, which should instead be provided by the host through the opengl interface.
  nvidia-smi:
    plugin: nil
    build-packages:
      - to amd64:
        - nvidia-utils-580
      - to arm64:
        - nvidia-utils-580
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      
      if [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ] || [ "$CRAFT_ARCH_BUILD_FOR" == "arm64" ]; then
        cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/
        
        license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580/
        mkdir -p $license_dir
        cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/
      else
        echo -e "#!/bin/sh\necho nvidia drivers are not available on $CRAFT_ARCH_BUILD_FOR\nexit 1" > $CRAFT_PART_INSTALL/usr/bin/nvidia-smi
        chmod a+rx $CRAFT_PART_INSTALL/usr/bin/nvidia-smi
      fi

  # OpenCL ICD and libigdgmm are required for Intel GPU vRAM lookup with clinfo
  intel-opencl-icd:
    plugin: nil
    build-packages:
      - wget
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ]; then
        # Legacy
        wget -nv https://github.com/intel/compute-runtime/releases/download/24.35.30872.36/intel-opencl-icd-legacy1_24.35.30872.36_amd64.deb
        wget -nv https://github.com/intel/compute-runtime/releases/download/24.35.30872.36/libigdgmm12_22.5.0_amd64.deb
      
        # Latest
        wget -nv https://github.com/intel/compute-runtime/releases/download/26.01.36711.4/intel-opencl-icd_26.01.36711.4-0_amd64.deb
        wget -nv https://github.com/intel/compute-runtime/releases/download/26.01.36711.4/libigdgmm12_22.9.0_amd64.deb
      
        dpkg --root=$CRAFT_PART_INSTALL --force-all -i *.deb
      
        # Two symlinks are created when installing intel-opencl-icd-legacy: 
        # etc/alternatives/ocloc -> /usr/bin/ocloc-24.35.0, usr/bin/ocloc -> /etc/alternatives/ocloc
        # These point to outside of the snap and fails store review. They are not required, so remove it.
        rm $CRAFT_PART_INSTALL/etc/alternatives/ocloc
        rm $CRAFT_PART_INSTALL/usr/bin/ocloc
      fi
      
      craftctl default

  cli:
    plugin: go
    build-snaps:
      - go/1.26/stable
    source: .
    source-type: local

  snap-catalog:
    plugin: dump
    source: https://canonical.github.io/inference-snaps-admin/onboarded-snaps.json
    source-type: file

  scripts:
    plugin: dump
    source: snap/local
    organize:
      completion.bash: bin/completion.bash

apps:
  inference:
    command: bin/inference
    completer: bin/completion.bash
    plugs:
      - network
      - snapd-control
      - hardware-observe
      - mount-observe
      - opengl

  d:
    command: bin/inference_d
    daemon: simple
    install-mode: enable
    restart-condition: on-failure
    plugs:
      - network
      - network-bind
      - snapd-control
