name: inference
base: core24
summary: Discover and manage local inference providers
description: |
  inference discovers inference-snap providers and reports which are
  installed. Later slices add install, remove, and proxy management.

grade: devel
confinement: strict

apps:
  inference:
    command: bin/inference
    environment:
      INFERENCE_SNAP_CATALOG_SEED: $SNAP/share/inference/snap-catalog-seed.json
    plugs:
      - network
      - snapd-control

parts:
  cli:
    plugin: go
    build-snaps:
      - go/1.26/stable
    source: .
    source-type: local
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/share/inference"
      go run ./cmd/inference generate-snap-catalog-seed "$CRAFT_PART_INSTALL/share/inference/snap-catalog-seed.json"
      craftctl default
