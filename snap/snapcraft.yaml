name: inference
base: core24
summary: Manage inference snaps
description: |
  This application acts as an entrypoint to the world of Inference Snaps.
  It provides a CLI to discover, install and manage inference snaps.

grade: stable
confinement: strict
adopt-info: version

plugs:
  provider:
    interface: content
    content: inference-provider
    target: $SNAP/share/providers

parts:
  version:
    plugin: dump
    build-packages:
      - git
    source: .
    override-pull: |
      craftctl set version="$(git -C $SNAPCRAFT_PROJECT_DIR describe --always --dirty)"

  cli:
    plugin: go
    build-snaps:
      - go/1.26/stable
    source: .
    source-type: local

  snap-catalog:
    plugin: dump
    source: https://canonical.github.io/inference-snaps-admin/onboarded-snaps.json
    source-type: file

  scripts:
    plugin: dump
    source: snap/local
    organize:
      completion.bash: bin/completion.bash
      seed-env.sh: bin/seed-env.sh

apps:
  inference:
    command: bin/inference
    command-chain:
      - bin/seed-env.sh
    completer: bin/completion.bash
    plugs:
      - network
      - snapd-control

  d:
    command: bin/inference_d
    command-chain:
      - bin/seed-env.sh
    daemon: simple
    install-mode: enable
    restart-condition: on-failure
    plugs:
      - network
      - network-bind
      - snapd-control
