name: PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  cla-check:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - name: Check if CLA signed
        uses: canonical/has-signed-canonical-cla@v2
      
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          only-new-issues: true

  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Run tests
        run: go test -v ./...

  build-publish:
    needs: [ lint, test ]
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-tags: true
          fetch-depth: 0

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: sudo snapcraft pack --destructive-mode

      - name: Publish snap to PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN_PR }}
        run: snapcraft upload *.snap --release=latest/edge/pr-${{ github.event.pull_request.number }}
